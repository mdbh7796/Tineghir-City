name: Android debug APK (Capacitor)

# Free distribution: every push builds a debug APK artifact.
# No Play signing, no keystore secrets — grab the APK from Actions artifacts
# or the GitHub Release attached by the pages job.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Runners are pinned to Ubuntu 24.04 on purpose: the ubuntu-latest label began
# migrating to Ubuntu 26 on 2026-10-19 and caused intermittent Gradle/Maven
# dependency-resolution failures. Revisit once the new image settles.
jobs:
  spike-guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Fail if spike artifacts present
        run: |
          test ! -e public/spike.html
          test ! -e public/spike-tiles
          test ! -e scripts/build-spike-pmtiles.mjs

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Validate pages + unit tests
        run: npm run check

      - name: Build web assets + sync Capacitor
        run: npm run android:sync

      - name: Verify Capacitor sync is clean (no native drift)
        run: git diff --exit-code -- android/app/src/main/AndroidManifest.xml android/capacitor.settings.gradle android/app/build.gradle capacitor.config.ts

      - name: Verify public/ matches src/ (no direct public/ edits)
        run: git diff --exit-code -- public/*.html public/script.js public/sw.js public/js public/sitemap.xml

      - name: Ensure Gradle wrapper is executable
        run: chmod +x android/gradlew

      - name: Install Android SDK packages (API 36)
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # Free-distribution release: push a tag `vX.Y.Z` to build a SIGNED release
  # APK and attach it to the GitHub Release.
  release:
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    # One-time setup (owner, local):
    #   1. keytool -genkeypair -alias tineghir -keyalg RSA -keysize 4096
    #        -validity 10000 -keystore ~/.secure/tineghir-release.keystore
    #   2. Back up the keystore + passwords offline x2 (loss = updates break).
    #   3. Repo Settings → Secrets → Actions: TINEGHIR_KEYSTORE_BASE64 (base64
    #      of the keystore), TINEGHIR_KEYSTORE_PASSWORD, TINEGHIR_KEY_ALIAS,
    #      TINEGHIR_KEY_PASSWORD.
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Validate pages + unit tests
        run: npm run check

      - name: Decode release keystore
        run: |
          test -n "${{ secrets.TINEGHIR_KEYSTORE_BASE64 }}" || (echo "missing TINEGHIR_KEYSTORE_BASE64 secret" && exit 1)
          echo "${{ secrets.TINEGHIR_KEYSTORE_BASE64 }}" | base64 -d > android/app/tineghir-release.keystore

      # Offline map tiles are optional until the owner publishes the first tile
      # release + public/tiles.json (see docs/tiles.md). With no manifest the
      # layer stays dormant and the signed release still ships.
      - name: Fetch offline map tiles (skipped when no tiles.json)
        run: npm run tiles:fetch

      - name: Stamp version + build signed release APK + AAB
        env:
          TINEGHIR_KEYSTORE_PATH: tineghir-release.keystore
          TINEGHIR_KEYSTORE_PASSWORD: ${{ secrets.TINEGHIR_KEYSTORE_PASSWORD }}
          TINEGHIR_KEY_ALIAS: ${{ secrets.TINEGHIR_KEY_ALIAS }}
          TINEGHIR_KEY_PASSWORD: ${{ secrets.TINEGHIR_KEY_PASSWORD }}
        run: |
          npm run build
          node scripts/release-version.mjs --apply
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleRelease bundleRelease

      - name: Verify APK + AAB signatures (must pass)
        working-directory: android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -f "$APK"
          test -f "$AAB"
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs "$APK"
          # AABs are JAR-signed, not APK-signed — verify with jarsigner.
          jarsigner -verify "$AAB"

      - name: Attach signed APK + AAB to GitHub Release
        run: |
          TAG="${{ github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes
          gh release upload "$TAG" \
            android/app/build/outputs/apk/release/app-release.apk \
            android/app/build/outputs/bundle/release/app-release.aab \
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
