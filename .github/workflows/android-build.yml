name: Android build (Capacitor)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  spike-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if spike artifacts present
        run: |
          test ! -e public/spike.html
          test ! -e public/spike-tiles
          test ! -e scripts/build-spike-pmtiles.mjs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web assets + sync Capacitor
        run: npm run android:sync

      - name: Ensure Gradle wrapper is executable
        run: chmod +x android/gradlew

      - name: Install Android SDK packages (API 36)
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build release AAB (unsigned)
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/bundle/release/app-release.aab
