name: Android build (Capacitor)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  spike-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fail if spike artifacts present
        run: |
          test ! -e public/spike.html
          test ! -e public/spike-tiles
          test ! -e scripts/build-spike-pmtiles.mjs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Validate pages + unit tests
        run: npm run check

      - name: Build web assets + sync Capacitor
        run: npm run android:sync

      - name: Ensure Gradle wrapper is executable
        run: chmod +x android/gradlew

      - name: Install Android SDK packages (API 36)
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build release AAB (unsigned, CI only)
        working-directory: android
        env:
          ALLOW_UNSIGNED_RELEASE: "1"
        run: ./gradlew bundleRelease

      - name: Verify release AAB signature
        working-directory: android
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$AAB" || echo "unsigned AAB without signing secrets"

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v6
        with:
          name: app-release
          path: android/app/build/outputs/bundle/release/app-release.aab

  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Validate pages + unit tests
        run: npm run check

      - name: Decode upload keystore
        run: |
          test -n "${{ secrets.TINEGHIR_KEYSTORE_BASE64 }}" || (echo "missing TINEGHIR_KEYSTORE_BASE64 secret" && exit 1)
          echo "${{ secrets.TINEGHIR_KEYSTORE_BASE64 }}" | base64 -d > android/app/tineghir-upload.keystore

      - name: Build signed release AAB (strict, with offline maps)
        working-directory: android
        env:
          TINEGHIR_KEYSTORE_PATH: tineghir-upload.keystore
          TINEGHIR_KEYSTORE_PASSWORD: ${{ secrets.TINEGHIR_KEYSTORE_PASSWORD }}
          TINEGHIR_KEY_ALIAS: ${{ secrets.TINEGHIR_KEY_ALIAS }}
          TINEGHIR_KEY_PASSWORD: ${{ secrets.TINEGHIR_KEY_PASSWORD }}
        run: |
          npm run tiles:fetch -- --release
          npm run build
          npx cap sync android
          node scripts/release-version.mjs --apply
          npx cap sync android
          cd android && ./gradlew bundleRelease

      - name: Verify AAB signature (must pass)
        working-directory: android
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$AAB"

      - name: Upload versioned AAB
        uses: actions/upload-artifact@v6
        with:
          name: tineghir-release-${{ github.ref_name }}
          path: android/app/build/outputs/bundle/release/app-release.aab
