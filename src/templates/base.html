<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>{{TITLE}}</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&amp;family=Outfit:wght@300;400;500;600&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="{{CANONICAL}}" />
    <meta name="theme-color" content="#1c1917" />
    <meta
      name="description"
      content="{{DESCRIPTION}}"
    />
    <meta property="og:title" content="{{TITLE}}" />
    <meta
      property="og:description"
      content="{{DESCRIPTION}}"
    />
    <meta
      property="og:image"
      content="https://www.tineghir.ma/images/og-image.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Todra Gorge canyon at sunset" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{CANONICAL}}" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{TITLE}}" />
    <meta
      name="twitter:description"
      content="{{DESCRIPTION}}"
    />
    <meta
      name="twitter:image"
      content="https://www.tineghir.ma/images/og-image.jpg"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "TouristDestination",
        "name": "Tineghir",
        "description": "{{DESCRIPTION}}",
        "url": "{{CANONICAL}}",
        "image": "https://www.tineghir.ma/images/og-image.jpg",
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 31.5139,
          "longitude": -5.5316
        }
      }
    </script>
    <link rel="stylesheet" href="style.css" />
<!--IF:leaflet-->
    <!-- Leaflet Map CSS & JS (vendored: npm leaflet@1.9.4, protomaps-leaflet@5.1.0 — CDN cannot load offline) -->
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
    <script src="vendor/leaflet/leaflet.js"></script>
    <script src="vendor/protomaps-leaflet/protomaps-leaflet.js"></script>
<!--ENDIF-->
  </head>

  <body
    class="h-full font-body bg-stone-50 text-stone-800 overflow-auto scroll-smooth"
    data-page="{{ACTIVE_NAV}}"
  >
{{NAV}}
    <main>
{{CONTENT}}
    </main>
{{FOOTER}}
    <!-- Lightbox Modal (Task 3 moves this to gallery.html only) -->
    <div
      id="lightbox"
      class="fixed inset-0 z-[100] bg-black/90 hidden flex items-center justify-center opacity-0 transition-opacity duration-300"
    >
      <button
        id="lightbox-close"
        aria-label="Close image viewer"
        class="absolute top-4 right-4 text-white hover:text-amber-500 transition-colors p-2 min-w-[44px] min-h-[44px]"
      >
        <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
      <img
        id="lightbox-img"
        src=""
        alt="Full screen view"
        class="max-h-[90vh] max-w-[90vw] object-contain rounded-lg shadow-2xl transform scale-95 transition-transform duration-300"
      />
    </div>
    <script src="js/drawer.js" defer></script>
    <script src="script.js" defer></script>
  </body>
</html>
