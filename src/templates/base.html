<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>{{TITLE}}</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&amp;family=Outfit:wght@300;400;500;600&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="images/icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="canonical" href="{{CANONICAL}}" />
    <meta name="theme-color" content="#1c1917" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // FOUC-free theme: stored tineghir-theme wins, else prefers-color-scheme.
      try {
        var t = localStorage.getItem('tineghir-theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
      window.__theme = {
        toggle: function () {
          var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
          document.documentElement.dataset.theme = next;
          try { localStorage.setItem('tineghir-theme', next); } catch (e) {}
          var b = document.getElementById('theme-toggle');
          if (b) { b.setAttribute('aria-pressed', String(next === 'dark')); b.textContent = next === 'dark' ? '☀️' : '🌙'; }
          return next;
        }
      };
    </script>
    <meta
      name="description"
      content="{{DESCRIPTION}}"
    />
    <meta property="og:title" content="{{TITLE}}" />
    <meta
      property="og:description"
      content="{{DESCRIPTION}}"
    />
    <meta
      property="og:image"
      content="https://www.tineghir.ma/images/og-image.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Todra Gorge canyon at sunset" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{CANONICAL}}" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{TITLE}}" />
    <meta
      name="twitter:description"
      content="{{DESCRIPTION}}"
    />
    <meta
      name="twitter:image"
      content="https://www.tineghir.ma/images/og-image.jpg"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "TouristDestination",
        "name": "Tineghir",
        "description": "{{DESCRIPTION}}",
        "url": "{{CANONICAL}}",
        "image": "https://www.tineghir.ma/images/og-image.jpg",
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 31.5139,
          "longitude": -5.5316
        }
      }
    </script>
    <link rel="stylesheet" href="style.css" />
<!--IF:leaflet-->
    <!-- Leaflet Map CSS & JS (vendored: npm leaflet@1.9.4, protomaps-leaflet@5.1.0 — CDN cannot load offline) -->
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
    <script src="vendor/leaflet/leaflet.js"></script>
    <script src="vendor/protomaps-leaflet/protomaps-leaflet.js"></script>
<!--ENDIF-->
  </head>

  <body
    class="h-full font-body bg-stone-50 dark:bg-stone-900 text-stone-800 dark:text-stone-200 overflow-auto scroll-smooth"
    data-page="{{ACTIVE_NAV}}"
  >
{{NAV}}
    <main>
{{CONTENT}}
    </main>
{{FOOTER}}
    <script src="js/drawer.js" defer></script>
    <script src="js/tools.js" defer></script>
    <script src="js/consent.js" defer></script>
    <script src="script.js" defer></script>
    <script>
      if ('serviceWorker' in navigator && !window.Capacitor) {
        window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
      }
      (function () {
        var b = document.getElementById('theme-toggle');
        if (b) {
          var dark = document.documentElement.dataset.theme === 'dark';
          b.setAttribute('aria-pressed', String(dark));
          b.textContent = dark ? '☀️' : '🌙';
        }
      })();
    </script>
  </body>
</html>
