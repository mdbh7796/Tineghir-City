<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>{{TITLE}}</title>

    <!-- Self-hosted webfonts (built from src/fonts.css into style.css): no
         third-party render-blocking CSS, stable preloadable URLs, and working
         typography offline in the Capacitor app. -->
    <link rel="preload" as="font" type="font/woff2" href="fonts/outfit-400-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="fonts/playfair-display-700-latin.woff2" crossorigin />
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="images/icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="canonical" href="{{CANONICAL}}" />
    <!-- No language alternates yet: fr/ar have no localized URLs, so naming
         them here would point at the English page and tell Google nothing.
         Add real alternates back only once /fr/ and /ar/ pages exist. -->
    <meta name="theme-color" content="#1c1917" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // FOUC-free theme: stored tineghir-theme wins, else prefers-color-scheme.
      try {
        var t = localStorage.getItem('tineghir-theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
      window.__theme = {
        toggle: function () {
          var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
          document.documentElement.dataset.theme = next;
          try { localStorage.setItem('tineghir-theme', next); } catch (e) {}
          var b = document.getElementById('theme-toggle');
          if (b) {
            b.setAttribute('aria-pressed', String(next === 'dark'));
            var u = b.querySelector('use');
            if (u) u.setAttribute('href', 'images/icons.svg#' + (next === 'dark' ? 'i-sun' : 'i-moon'));
          }
          return next;
        }
      };
    </script>
    <meta
      name="description"
      content="{{DESCRIPTION}}"
    />
    <meta property="og:title" content="{{TITLE}}" />
    <meta
      property="og:description"
      content="{{DESCRIPTION}}"
    />
    <meta
      property="og:image"
      content="https://mdbh7796.github.io/Tineghir-City/images/og-image.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Todra Gorge canyon at sunset" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{CANONICAL}}" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{TITLE}}" />
    <meta
      name="twitter:description"
      content="{{DESCRIPTION}}"
    />
    <meta
      name="twitter:image"
      content="https://mdbh7796.github.io/Tineghir-City/images/og-image.jpg"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "TouristDestination",
        "name": "Tineghir",
        "description": "{{DESCRIPTION}}",
        "url": "{{CANONICAL}}",
        "image": "https://mdbh7796.github.io/Tineghir-City/images/og-image.jpg",
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 31.5139,
          "longitude": -5.5316
        }
      }
    </script>
    <link rel="stylesheet" href="style.css" />
<!--IF:leaflet-->
    <!-- Leaflet Map CSS & JS (vendored: npm leaflet@1.9.4, protomaps-leaflet@5.1.0 — CDN cannot load offline).
         defer keeps them off the render-blocking path; document order still runs
         them before script.js, so `L` exists when the map initialises. -->
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
    <script src="vendor/leaflet/leaflet.js" defer></script>
    <script src="vendor/protomaps-leaflet/protomaps-leaflet.js" defer></script>
<!--ENDIF-->
  </head>

  <body
    class="h-full font-body bg-white dark:bg-stone-900 text-stone-900 dark:text-stone-200 overflow-auto scroll-smooth antialiased"
    data-page="{{ACTIVE_NAV}}"
  >
{{NAV}}
    <main>
{{CONTENT}}
    </main>
{{FOOTER}}
    <script src="js/drawer.js" defer></script>
    <script src="js/tools.js" defer></script>
    <script src="js/consent.js" defer></script>
    <script src="script.js" defer></script>
    <script>
      if ('serviceWorker' in navigator && !window.Capacitor) {
        window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
      }
      (function () {
        var b = document.getElementById('theme-toggle');
        if (b) {
          var dark = document.documentElement.dataset.theme === 'dark';
          b.setAttribute('aria-pressed', String(dark));
          var u = b.querySelector('use');
          if (u) u.setAttribute('href', 'images/icons.svg#' + (dark ? 'i-sun' : 'i-moon'));
        }
      })();
    </script>
  </body>
</html>
